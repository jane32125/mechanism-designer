<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>會動的風景畫：智慧設計助手</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif; -webkit-user-select: none; user-select: none; margin: 0; background-color: #f1f5f9; overflow: hidden; height: 100vh; }
        canvas { touch-action: none; display: block; background-color: #cbd5e1; }
        input[type="range"] { accent-color: #2563eb; height: 6px; }
        .tab-active { border-bottom: 3px solid #2563eb; color: #2563eb; background-color: #eff6ff; font-weight: 800; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .sidebar-content { height: calc(100vh - 64px - 140px); }
        @media (max-width: 768px) {
            .sidebar-content { height: auto; max-height: 45vh; }
        }
        .selected-ui { animation: pulse-border 2s infinite; }
        @keyframes pulse-border {
            0% { border-color: rgba(239, 68, 68, 0.5); }
            50% { border-color: rgba(239, 68, 68, 1); }
            100% { border-color: rgba(239, 68, 68, 0.5); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useMemo, useCallback } = React;

        // 內建 SVG 圖示系統
        const Icon = ({ name, size = 20, className = "" }) => {
            const paths = {
                Layout: <path d="M3 3h7v7H3zm11 0h7v7h-7zm0 11h7v7h-7zM3 14h7v7H3z" />,
                Plus: <path d="M12 5v14M5 12h14" />,
                Trash: <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6" />,
                Play: <path d="m5 3 14 9-14 9V3z" />,
                Stop: <rect x="4" y="4" width="16" height="16" rx="2" />,
                Reset: <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8m0-5v5h5" />,
                Zoom: <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />,
                Zap: <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z" />
            };
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {paths[name] || <circle cx="12" cy="12" r="10" />}
                </svg>
            );
        };

        const App = () => {
            // --- 規格設定 ---
            const SCALE = 2.5; 
            const DX = 12 * SCALE;
            const DY = 12 * Math.sin(Math.PI / 3) * SCALE; 
            const BOARD_W = 350 * SCALE;
            const BOARD_H = 300 * SCALE;

            const [viewScale, setViewScale] = useState(0.8);
            const [viewOffset, setViewOffset] = useState({ x: 50, y: 50 });
            
            const GEAR_COLORS = {
                12: { hex: '#4ade80' }, 18: { hex: '#fb923c' }, 24: { hex: '#fbbf24' },
                30: { hex: '#22d3ee' }, 36: { hex: '#a855f7' }, 48: { hex: '#6366f1' }
            };

            // --- 狀態管理 ---
            const [images, setImages] = useState([]); 
            const [selectedImgId, setSelectedImgId] = useState(null);
            const [activeTab, setActiveTab] = useState('design');
            const [components, setComponents] = useState([]);
            const [selectedId, setSelectedId] = useState(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [time, setTime] = useState(0);

            // --- 互動狀態 ---
            const [dragging, setDragging] = useState(null); 
            const [panning, setPanning] = useState(null);   
            const [pinchDist, setPinchDist] = useState(null);

            const canvasRef = useRef(null);
            const requestRef = useRef();

            // 鍵盤刪除功能
            const deleteSelected = useCallback(() => {
                if (selectedId) {
                    setComponents(prev => {
                        const next = prev.filter(c => c.id !== selectedId);
                        // 如果刪掉的是動力源，自動指定下一個
                        if (next.length > 0 && !next.some(c => c.isInput)) {
                            next[0].isInput = true;
                        }
                        return [...next];
                    });
                    setSelectedId(null);
                }
            }, [selectedId]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Delete' || e.key === 'Backspace') {
                        deleteSelected();
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [deleteSelected]);

            useEffect(() => {
                const animate = () => {
                    if (isPlaying) setTime(t => t + 0.04);
                    requestRef.current = requestAnimationFrame(animate);
                };
                requestRef.current = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(requestRef.current);
            }, [isPlaying]);

            // 座標轉換
            const screenToCanvas = (clientX, clientY) => {
                const rect = canvasRef.current.getBoundingClientRect();
                const x = (clientX - rect.left) - viewOffset.x;
                const y = (clientY - rect.top) - viewOffset.y;
                return { x: x / viewScale, y: y / viewScale };
            };

            const snapToTriangle = (x, y) => {
                const r = Math.max(0, Math.round(y / DY));
                const sy = r * DY;
                const rowShift = (r % 2 === 0) ? 0 : DX / 2;
                const c = Math.max(0, Math.round((x - rowShift) / DX));
                const sx = c * DX + rowShift;
                return { sx, sy };
            };

            const handleImageUpload = (e) => {
                const files = Array.from(e.target.files);
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = f => {
                        const img = new Image();
                        img.onload = () => setImages(prev => [...prev, { id: Date.now()+Math.random(), name: file.name, obj: img, opacity: 0.5, scale: 1.0, x: 0, y: 0 }]);
                        img.src = f.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            };

            // --- 動力模擬引擎 ---
            const gearStates = useMemo(() => {
                const states = {};
                const input = components.find(c => c.isInput);
                if (!input) return states;
                
                states[input.id] = { rotation: time, active: true };
                const queue = [input];
                const visited = new Set([input.id]);
                
                while(queue.length > 0) {
                    const curr = queue.shift();
                    components.forEach(other => {
                        if (!visited.has(other.id)) {
                            const d = Math.hypot(curr.x - other.x, curr.y - other.y);
                            if (Math.abs(d - (curr.teeth + other.teeth) * SCALE) < 10) {
                                const ratio = curr.teeth / other.teeth;
                                states[other.id] = { rotation: -states[curr.id].rotation * ratio, active: true };
                                visited.add(other.id);
                                queue.push(other);
                            }
                        }
                    });
                }
                return states;
            }, [components, time]);

            // --- 互動事件 ---
            const handleStart = (e) => {
                const isTouch = e.touches && e.touches.length > 0;
                if (isTouch && e.touches.length === 2) {
                    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    setPinchDist(d); return;
                }
                const clientX = isTouch ? e.touches[0].clientX : e.clientX;
                const clientY = isTouch ? e.touches[0].clientY : e.clientY;
                const { x, y } = screenToCanvas(clientX, clientY);

                for (const c of [...components].reverse()) {
                    if (Math.hypot(c.x - x, c.y - y) < c.teeth * SCALE + 15) {
                        setDragging({ id: c.id, offset: { x: c.x - x, y: c.y - y } });
                        setSelectedId(c.id); return;
                    }
                }
                setPanning({ x: clientX - viewOffset.x, y: clientY - viewOffset.y });
                setSelectedId(null);
            };

            const handleMove = (e) => {
                const isTouch = e.touches && e.touches.length > 0;
                if (isTouch && e.touches.length === 2 && pinchDist) {
                    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    setViewScale(prev => Math.max(0.2, Math.min(3, prev * (d / pinchDist))));
                    setPinchDist(d); return;
                }
                const clientX = isTouch ? e.touches[0].clientX : e.clientX;
                const clientY = isTouch ? e.touches[0].clientY : e.clientY;

                if (dragging) {
                    const { x, y } = screenToCanvas(clientX, clientY);
                    setComponents(prev => prev.map(c => c.id === dragging.id ? { ...c, x: x + dragging.offset.x, y: y + dragging.offset.y } : c));
                } else if (panning) {
                    setViewOffset({ x: clientX - panning.x, y: clientY - panning.y });
                }
            };

            const handleEnd = () => {
                if (dragging) {
                    setComponents(prev => prev.map(c => {
                        if (c.id !== dragging.id) return c;
                        const { sx, sy } = snapToTriangle(c.x, c.y);
                        return { ...c, x: sx, y: sy };
                    }));
                }
                setDragging(null); setPanning(null); setPinchDist(null);
            };

            // --- 繪圖 ---
            useEffect(() => {
                const canvas = canvasRef.current; const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth; canvas.height = window.innerHeight;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.save();
                ctx.translate(viewOffset.x, viewOffset.y); ctx.scale(viewScale, viewScale);

                // 底板
                ctx.fillStyle = "#ffffff"; ctx.fillRect(-20, -20, BOARD_W+40, BOARD_H+40);
                ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 1/viewScale; ctx.strokeRect(-20, -20, BOARD_W+40, BOARD_H+40);

                // 圖片層
                images.forEach(img => {
                    ctx.save(); ctx.globalAlpha = img.opacity;
                    const w = BOARD_W * img.scale; const h = (img.obj.height/img.obj.width)*w;
                    ctx.drawImage(img.obj, img.x, img.y, w, h); ctx.restore();
                });

                // 孔位
                ctx.fillStyle = '#cbd5e1';
                for (let r=0; r<25; r++) {
                    const rs = (r%2===0)?0:DX/2;
                    for (let c=0; c<26; c++) { ctx.beginPath(); ctx.arc(c*DX+rs, r*DY, 2, 0, Math.PI*2); ctx.fill(); }
                }

                // 齒輪
                components.forEach(c => {
                    const s = gearStates[c.id] || { rotation: 0 }; const r = c.teeth*SCALE;
                    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(s.rotation);
                    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);
                    ctx.strokeStyle = c.id === selectedId ? '#ef4444' : (s.active ? '#2563eb' : '#475569');
                    ctx.lineWidth = 3; ctx.stroke(); ctx.fillStyle = (GEAR_COLORS[c.teeth]?.hex || '#94a3b8') + '99'; ctx.fill();
                    for(let i=0; i<c.teeth; i++){ ctx.rotate((Math.PI*2)/c.teeth); ctx.fillStyle='#475569'; ctx.fillRect(r-2, -2, 6, 4); }
                    ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI*2); ctx.fillStyle = c.isInput ? '#ef4444' : '#1e293b'; ctx.fill();
                    ctx.restore();
                });
                ctx.restore();
            }, [components, images, gearStates, selectedId, viewScale, viewOffset]);

            const curActiveImg = useMemo(() => images.find(i => i.id === selectedImgId), [images, selectedImgId]);

            return (
                <div className="flex flex-col h-screen overflow-hidden bg-slate-900">
                    <header className="bg-slate-900 text-white p-3 md:p-4 flex justify-between items-center z-20 shrink-0 border-b border-white/10 shadow-xl">
                        <div className="flex items-center gap-2">
                            <div className="bg-blue-600 p-1.5 rounded-lg"><Icon name="Layout" size={20} /></div>
                            <h1 className="text-base md:text-lg font-black tracking-tight">風景畫設計助手</h1>
                        </div>
                        <button onClick={() => { setViewScale(0.7); setViewOffset({x:50,y:50}); }} className="bg-white/10 px-3 py-1.5 rounded-full text-[10px] font-bold uppercase flex items-center gap-2 border border-white/10">
                            <Icon name="Zoom" size={12} /> 重置視角
                        </button>
                    </header>

                    <div className="flex flex-col md:flex-row flex-1 overflow-hidden relative">
                        <main className="flex-1 bg-slate-200 relative overflow-hidden">
                            <canvas ref={canvasRef} onMouseDown={handleStart} onMouseMove={handleMove} onMouseUp={handleEnd} onTouchStart={handleStart} onTouchMove={handleMove} onTouchEnd={handleEnd} />
                            
                            <div className="absolute bottom-6 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-md p-2 rounded-full shadow-2xl flex items-center gap-4 border border-white ring-1 ring-black/5">
                                <button onClick={() => setIsPlaying(!isPlaying)} className={`w-12 h-12 rounded-full flex items-center justify-center text-white shadow-lg transition-all ${isPlaying ? 'bg-red-500' : 'bg-green-500'}`}>
                                    <Icon name={isPlaying ? "Stop" : "Play"} size={24} />
                                </button>
                                <button onClick={() => { setTime(0); setIsPlaying(false); }} className="text-slate-400 p-2"><Icon name="Reset" size={20} /></button>
                                <div className="border-l pl-4 pr-3">
                                    <div className="text-[8px] text-slate-400 font-black uppercase">模擬狀態</div>
                                    <div className={`text-[11px] font-black uppercase ${isPlaying ? 'text-green-500' : 'text-slate-400'}`}>{isPlaying ? '運轉中' : '暫停'}</div>
                                </div>
                            </div>
                        </main>

                        <aside className="w-full md:w-80 bg-white border-t md:border-t-0 md:border-l border-slate-200 flex flex-col z-10 shrink-0 shadow-2xl">
                            <div className="flex border-b bg-slate-50 p-1">
                                {['upload', 'design'].map(tab => (
                                    <button key={tab} onClick={() => setActiveTab(tab)} className={`flex-1 py-3 text-[11px] font-black uppercase rounded-lg ${activeTab === tab ? 'tab-active' : 'text-slate-400'}`}>
                                        {tab === 'upload' ? '1. 畫作底圖' : '2. 零件庫'}
                                    </button>
                                ))}
                            </div>
                            
                            <div className="sidebar-content overflow-y-auto p-4 space-y-5">
                                {activeTab === 'upload' && (
                                    <div className="space-y-4 text-slate-600">
                                        <div className="p-5 border-2 border-dashed border-slate-200 rounded-2xl text-center bg-slate-50 relative group cursor-pointer hover:border-blue-400">
                                            <input type="file" multiple className="absolute inset-0 opacity-0 cursor-pointer" onChange={handleImageUpload} />
                                            <Icon name="Plus" size={32} className="mx-auto mb-2 text-slate-300" />
                                            <p className="text-[11px] font-bold">上傳背景圖片</p>
                                        </div>

                                        {images.map(img => (
                                            <div key={img.id} onClick={() => setSelectedImgId(img.id)} className={`p-2 rounded-xl border flex items-center gap-2 cursor-pointer transition-all ${selectedImgId === img.id ? 'border-blue-500 bg-blue-50' : 'bg-white'}`}>
                                                <div className="w-10 h-10 bg-slate-100 rounded border overflow-hidden"><img src={img.obj.src} className="w-full h-full object-cover" /></div>
                                                <span className="flex-1 text-[10px] font-bold truncate">{img.name}</span>
                                                <button onClick={() => setImages(images.filter(i=>i.id!==img.id))} className="text-slate-300 hover:text-red-500"><Icon name="Trash" size={16} /></button>
                                            </div>
                                        ))}

                                        {curActiveImg && (
                                            <div className="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-4 shadow-inner">
                                                <h4 className="text-[10px] font-black text-blue-600 uppercase border-b border-blue-100 pb-2">圖層微調工具</h4>
                                                {[
                                                    { label: '透明度', k: 'opacity', min: 0, max: 1, step: 0.05, disp: v => Math.round(v*100)+'%' },
                                                    { label: '縮放比例', k: 'scale', min: 0.1, max: 4, step: 0.1, disp: v => 'x'+v.toFixed(1) },
                                                    { label: '水平位置', k: 'x', min: -800, max: 800, step: 1, disp: v => v+'px' },
                                                    { label: '垂直位置', k: 'y', min: -800, max: 800, step: 1, disp: v => v+'px' }
                                                ].map(c => (
                                                    <div key={c.k} className="space-y-1">
                                                        <div className="flex justify-between text-[10px] font-bold text-slate-500"><span>{c.label}</span><span className="text-blue-600">{c.disp(curActiveImg[c.k])}</span></div>
                                                        <input type="range" min={c.min} max={c.max} step={c.step} value={curActiveImg[c.k]} onChange={e => {
                                                            const val = parseFloat(e.target.value);
                                                            setImages(prev => prev.map(img => img.id === selectedImgId ? {...img, [c.k]: val} : img));
                                                        }} className="w-full" />
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                )}

                                {activeTab === 'design' && (
                                    <div className="space-y-5">
                                        <div className="grid grid-cols-2 gap-2">
                                            {[12, 18, 24, 30, 36, 48].map(sz => (
                                                <button key={sz} onClick={() => {
                                                    const pos = snapToTriangle(100, 100);
                                                    setComponents(prev => [...prev, { id: Date.now(), type: 'gear', x: pos.sx, y: pos.sy, teeth: sz, isInput: prev.length===0 }]);
                                                }} className="p-3 border-2 bg-white rounded-xl text-[10px] font-black hover:border-blue-500 transition-all flex flex-col items-center gap-1 shadow-sm">
                                                    <div className="w-3 h-3 rounded-full" style={{backgroundColor: GEAR_COLORS[sz].hex}}></div>
                                                    R{sz} 齒輪
                                                </button>
                                            ))}
                                        </div>

                                        {selectedId && (
                                            <div className="p-4 bg-slate-900 text-white rounded-2xl shadow-xl space-y-4 border border-white/10 selected-ui">
                                                <div className="flex justify-between items-center">
                                                    <span className="text-[10px] font-black text-blue-400 uppercase tracking-widest">零件編輯</span>
                                                    <button onClick={deleteSelected} className="text-red-400 p-1 hover:bg-red-500/20 rounded-lg transition-all"><Icon name="Trash" size={18} /></button>
                                                </div>
                                                <button onClick={() => setComponents(prev => prev.map(c => ({...c, isInput: c.id === selectedId})))} className={`w-full py-3 rounded-xl text-[10px] font-black transition-all ${components.find(c=>c.id===selectedId)?.isInput ? 'bg-blue-600 shadow-lg text-white' : 'bg-slate-800 text-slate-400 hover:text-white'}`}>
                                                    <Icon name="Zap" size={12} className="inline mr-1" /> 設為動力主動輪
                                                </button>
                                                <p className="text-[9px] text-slate-500 text-center italic">提示：選中後按 Delete 鍵亦可刪除</p>
                                            </div>
                                        )}
                                        
                                        <div className="p-4 bg-blue-50 rounded-xl border border-blue-100 text-[10px] text-blue-800/70 leading-relaxed italic">
                                            <b>手機操作秘訣：</b><br/>
                                            • 單指拖動齒輪：移動位置。<br/>
                                            • 單指平移動畫：點擊空白處拖動。<br/>
                                            • 雙指張合：縮放設計區域。
                                        </div>
                                    </div>
                                )}
                            </div>
                        </aside>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
