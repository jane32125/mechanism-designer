<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會動的風景畫：齒輪機構設計助手</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: sans-serif; -webkit-user-select: none; user-select: none; margin: 0; background-color: #f1f5f9; }
        canvas { touch-action: none; cursor: crosshair; background-color: #ffffff; display: block; }
        input[type="range"] { accent-color: #2563eb; height: 6px; }
        .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; background-color: #eff6ff; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @keyframes pulse-highlight {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .selected-ui { animation: pulse-highlight 2s infinite; border-color: #3b82f6 !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useMemo, useCallback } = React;
        
        // 健壯的圖示組件：手動渲染 SVG 避免 UMD 衝突
        const Icon = ({ name, size = 20, className = "" }) => {
            const [iconData, setIconData] = useState(null);
            useEffect(() => {
                let mounted = true;
                const loadIcon = () => {
                    if (window.lucide && window.lucide.icons) {
                        const data = window.lucide.icons[name];
                        if (data && mounted) setIconData(data);
                    } else {
                        setTimeout(loadIcon, 50);
                    }
                };
                loadIcon();
                return () => { mounted = false; };
            }, [name]);
            if (!iconData) return <span style={{ width: size, height: size, display: 'inline-block' }} />;
            const children = Array.isArray(iconData[2]) ? iconData[2] : [];
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`inline-block align-middle pointer-events-none ${className}`}>
                    {children.map((child, i) => {
                        if (!Array.isArray(child)) return null;
                        const Tag = child[0];
                        const attrs = child[1];
                        return <Tag key={i} {...attrs} />;
                    })}
                </svg>
            );
        };

        const App = () => {
            // --- 物理規格設定 ---
            const SCALE = 2.5; 
            const BOARD_W_MM = 350; 
            const BOARD_H_MM = 300; 
            const GRID_MM = 12;     
            const COLS = 26;        
            const ROWS = 25;        

            const CANVAS_W = BOARD_W_MM * SCALE; 
            const CANVAS_H = BOARD_H_MM * SCALE; 

            const DX = GRID_MM * SCALE;
            const DY = GRID_MM * Math.sin(Math.PI / 3) * SCALE; 

            // 正確計算 26x25 正三角形網格總寬高以進行置中
            const GRID_TOTAL_W = (COLS - 1) * DX + (DX / 2);
            const GRID_TOTAL_H = (ROWS - 1) * DY;

            const OFFSET_X = (CANVAS_W - GRID_TOTAL_W) / 2;
            const OFFSET_Y = (CANVAS_H - GRID_TOTAL_H) / 2;

            // --- 狀態管理 ---
            const [images, setImages] = useState([]); 
            const [selectedImgId, setSelectedImgId] = useState(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [activeTab, setActiveTab] = useState('upload');
            const [components, setComponents] = useState([]);
            const [selectedId, setSelectedId] = useState(null);
            const [time, setTime] = useState(0);
            const [dragging, setDragging] = useState(null);

            const canvasRef = useRef(null);
            const requestRef = useRef();

            const animate = () => {
                if (isPlaying) setTime(prev => prev + 0.04);
                requestRef.current = requestAnimationFrame(animate);
            };

            useEffect(() => {
                requestRef.current = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(requestRef.current);
            }, [isPlaying]);

            // --- 吸附邏輯 ---
            const snapToTriangle = (x, y) => {
                const r = Math.max(0, Math.min(ROWS - 1, Math.round((y - OFFSET_Y) / DY)));
                const sy = OFFSET_Y + r * DY;
                const rowShift = (r % 2 === 0) ? 0 : DX / 2;
                const c = Math.max(0, Math.min(COLS - 1, Math.round((x - OFFSET_X - rowShift) / DX)));
                const sx = OFFSET_X + c * DX + rowShift;
                return { sx, sy };
            };

            const removeComponent = useCallback((idToRemove) => {
                setComponents(prev => {
                    const next = prev.filter(c => c.id !== idToRemove);
                    if (next.length > 0 && !next.some(c => c.isInput)) {
                        const firstGear = next.find(c => c.type === 'gear');
                        if (firstGear) firstGear.isInput = true;
                    }
                    return [...next];
                });
                setSelectedId(null);
            }, []);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if ((e.key === 'Delete' || e.key === 'Backspace') && selectedId) removeComponent(selectedId);
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [selectedId, removeComponent]);

            // --- 圖片管理 ---
            const handleImageUpload = (e) => {
                const files = Array.from(e.target.files);
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (f) => {
                        const img = new Image();
                        img.onload = () => {
                            setImages(prev => [...prev, {
                                id: Date.now() + Math.random(),
                                name: file.name, obj: img, opacity: 0.5, scale: 1.0, x: 0, y: 0
                            }]);
                        };
                        img.src = f.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            };

            const updateImage = (id, params) => setImages(prev => prev.map(img => img.id === id ? { ...img, ...params } : img));
            const removeImage = (id) => { 
                setImages(prev => prev.filter(img => img.id !== id)); 
                if(selectedImgId === id) setSelectedImgId(null);
            };

            // --- 零件添加 ---
            const addGear = (teeth = 12) => {
                const colorMap = { 12: '#4ade80', 18: '#fb923c', 24: '#fbbf24', 36: '#a855f7', 48: '#6366f1' };
                const pos = snapToTriangle(CANVAS_W / 2, CANVAS_H / 2);
                setComponents(prev => [...prev, {
                    id: Date.now(), type: 'gear', x: pos.sx, y: pos.sy,
                    teeth, color: colorMap[teeth] || '#94a3b8',
                    isInput: prev.length === 0
                }]);
                setActiveTab('design');
            };

            // --- 模擬引擎 ---
            const gearStates = useMemo(() => {
                const states = {};
                const inputGear = components.find(c => c.isInput);
                if (!inputGear) return states;

                states[inputGear.id] = { rotation: time, active: true };
                const queue = [inputGear];
                const visited = new Set([inputGear.id]);

                while (queue.length > 0) {
                    const curr = queue.shift();
                    const currRot = states[curr.id].rotation;
                    components.forEach(other => {
                        if (!visited.has(other.id)) {
                            const d = Math.hypot(curr.x - other.x, curr.y - other.y);
                            const meshD = (curr.teeth + other.teeth) * SCALE;
                            // 模數 2 嚙合容許誤差 8px
                            if (Math.abs(d - meshD) < 8) {
                                states[other.id] = { rotation: -currRot * (curr.teeth / other.teeth), active: true };
                                visited.add(other.id); queue.push(other);
                            }
                        }
                    });
                }
                return states;
            }, [components, time]);

            // --- 互動邏輯 ---
            const handleMouseDown = (e) => {
                const rect = canvasRef.current.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                for (const c of [...components].reverse()) {
                    if (Math.hypot(c.x - mx, c.y - my) < c.teeth * SCALE + 15) {
                        setDragging({ id: c.id, offset: { x: c.x - mx, y: c.y - my } });
                        setSelectedId(c.id); return;
                    }
                }
                setSelectedId(null);
            };

            const handleMouseMove = (e) => {
                if (!dragging) return;
                const rect = canvasRef.current.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                setComponents(prev => prev.map(c => 
                    c.id === dragging.id ? { ...c, x: mx + dragging.offset.x, y: my + dragging.offset.y } : c
                ));
            };

            const handleMouseUp = () => {
                if (!dragging) return;
                setComponents(prev => prev.map(c => {
                    if (c.id !== dragging.id) return c;
                    const { sx, sy } = snapToTriangle(c.x, c.y);
                    return { ...c, x: sx, y: sy };
                }));
                setDragging(null);
            };

            // --- 繪圖渲染 ---
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 1. 繪製圖片圖層
                images.forEach(imgData => {
                    ctx.save(); ctx.globalAlpha = imgData.opacity;
                    const drawW = canvas.width * imgData.scale;
                    const drawH = (imgData.obj.height / imgData.obj.width) * drawW;
                    ctx.drawImage(imgData.obj, imgData.x, imgData.y, drawW, drawH);
                    ctx.restore();
                });

                // 2. 繪製正三角形孔位
                ctx.fillStyle = '#cbd5e1';
                for (let r = 0; r < ROWS; r++) {
                    const y = OFFSET_Y + r * DY;
                    const rowShift = (r % 2 === 0) ? 0 : DX / 2;
                    for (let c = 0; c < COLS; c++) {
                        ctx.beginPath(); ctx.arc(OFFSET_X + c * DX + rowShift, y, 2.2, 0, Math.PI * 2); ctx.fill();
                    }
                }

                // 3. 繪製齒輪
                components.forEach(c => {
                    const s = gearStates[c.id] || { rotation: 0, active: false };
                    const r = c.teeth * SCALE;
                    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(s.rotation);
                    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
                    ctx.strokeStyle = s.active ? '#3b82f6' : (c.id === selectedId ? '#ef4444' : '#475569');
                    ctx.lineWidth = s.active || c.id === selectedId ? 4 : 2;
                    ctx.stroke(); ctx.fillStyle = c.color + (c.id === selectedId ? 'BB' : '88'); ctx.fill();
                    for(let i=0; i<c.teeth; i++) {
                        ctx.rotate((Math.PI * 2) / c.teeth); ctx.fillStyle = '#475569'; ctx.fillRect(r - 2, -2, 6, 4);
                    }
                    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2);
                    ctx.fillStyle = c.isInput ? '#ef4444' : '#1e293b'; ctx.fill();
                    if (c.isInput) { ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke(); }
                    ctx.restore();
                });
            }, [components, images, gearStates, selectedId]);

            const activeImg = useMemo(() => images.find(img => img.id === selectedImgId), [images, selectedImgId]);

            return (
                <div className="flex flex-col h-screen text-slate-900 overflow-hidden bg-slate-200 font-sans">
                    <header className="bg-slate-900 text-white p-4 flex justify-between items-center shadow-2xl z-20 border-b border-white/10 flex-shrink-0">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 p-2 rounded-xl flex items-center justify-center shadow-inner"><Icon name="Layout" size={24} /></div>
                            <div>
                                <h1 className="text-xl font-black tracking-tight mb-0.5 leading-none">會動的風景畫：齒輪設計助手</h1>
                                <p className="text-[10px] text-slate-400 uppercase tracking-widest font-black leading-none">350x300mm | 26x25 三角孔位 | 純齒輪版</p>
                            </div>
                        </div>
                    </header>

                    <div className="flex flex-1 overflow-hidden">
                        <aside className="w-80 bg-white border-r border-slate-300 flex flex-col shadow-2xl z-10 flex-shrink-0">
                            <div className="flex border-b border-slate-200 bg-slate-50 p-1">
                                {['upload', 'design'].map(tab => (
                                    <button key={tab} onClick={() => setActiveTab(tab)}
                                        className={`flex-1 py-3 text-xs font-black uppercase transition-all rounded-lg ${activeTab === tab ? 'tab-active shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}>
                                        {tab === 'upload' ? '1. 畫作管理' : '2. 放置零件'}
                                    </button>
                                ))}
                            </div>
                            
                            <div className="flex-1 overflow-y-auto p-5 space-y-6">
                                {activeTab === 'upload' && (
                                    <div className="space-y-5 text-slate-600">
                                        <div className="p-6 border-2 border-dashed border-slate-200 rounded-3xl text-center bg-slate-50 relative group cursor-pointer hover:border-blue-400 transition-all">
                                            <input type="file" multiple className="absolute inset-0 opacity-0 cursor-pointer" onChange={handleImageUpload} />
                                            <Icon name="PlusCircle" size={40} className="mx-auto mb-3 text-slate-300 group-hover:text-blue-500 transition-colors" />
                                            <p className="text-sm font-bold">上傳圖片圖層</p>
                                        </div>
                                        {images.length > 0 && (
                                            <div className="space-y-2">
                                                <h3 className="text-[10px] font-black uppercase tracking-widest px-2">圖層清單</h3>
                                                {images.map(img => (
                                                    <div key={img.id} onClick={() => setSelectedImgId(img.id)} className={`p-3 rounded-xl border flex items-center gap-3 cursor-pointer ${selectedImgId === img.id ? 'border-blue-500 bg-blue-50 shadow-sm' : 'border-slate-100 bg-white'}`}>
                                                        <div className="w-10 h-10 bg-slate-100 rounded-lg overflow-hidden border border-slate-200"><img src={img.obj.src} className="w-full h-full object-cover" /></div>
                                                        <span className="flex-1 text-[10px] font-bold truncate">{img.name}</span>
                                                        <button onClick={() => removeImage(img.id)} className="text-slate-300 hover:text-red-500"><Icon name="Trash2" size={16} /></button>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                        {activeImg && (
                                            <div className="space-y-4 bg-slate-50 p-4 rounded-2xl border border-slate-100 shadow-inner">
                                                <h4 className="text-[10px] font-black text-blue-600 uppercase border-b border-blue-100 pb-2 mb-4">圖層調整</h4>
                                                {['opacity', 'scale', 'x', 'y'].map(k => (
                                                    <div key={k} className="space-y-2">
                                                        <div className="flex justify-between uppercase text-[10px] font-black"><span>{k}</span><span className="text-blue-600">{activeImg[k]}</span></div>
                                                        <input type="range" min={k==='scale'?0.1:(k==='opacity'?0:-1000)} max={k==='scale'?4:(k==='opacity'?1:1000)} step={k==='x'||k==='y'?1:0.05} value={activeImg[k]} onChange={(e)=>updateImage(selectedImgId,{[k]:parseFloat(e.target.value)})} className="w-full" />
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                )}
                                {activeTab === 'design' && (
                                    <div className="space-y-6">
                                        <h3 className="text-[10px] font-black uppercase tracking-widest text-center text-slate-400">點擊新增齒輪 (模數 2.0)</h3>
                                        <div className="grid grid-cols-2 gap-3">
                                            {[12, 18, 24, 36, 48].map(size => (
                                                <button key={size} onClick={() => addGear(size)} className="p-4 border-2 border-slate-100 rounded-2xl bg-white text-[10px] font-black hover:border-blue-400 transition-all shadow-sm">R{size} 齒輪</button>
                                            ))}
                                        </div>
                                        {selectedId && (
                                            <div className="p-5 bg-slate-900 text-white rounded-3xl shadow-xl border-4 border-slate-700 selected-ui">
                                                <div className="flex justify-between items-center mb-5">
                                                    <span className="text-[10px] font-black uppercase text-blue-400 tracking-tighter">零件編輯</span>
                                                    <button onClick={() => removeComponent(selectedId)} className="text-red-400 p-1 hover:bg-red-500/20 rounded-lg"><Icon name="Trash2" size={20} /></button>
                                                </div>
                                                <button onClick={() => setComponents(prev => prev.map(c => ({ ...c, isInput: c.id === selectedId ? true : (c.isInput ? false : c.isInput) })))} className={`w-full py-4 rounded-xl text-xs font-black transition-all ${components.find(c => c.id === selectedId).isInput ? 'bg-blue-600 shadow-lg text-white' : 'bg-slate-800 text-slate-400'}`}>設為動力主動輪</button>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>

                            <div className="p-5 bg-slate-50 border-t border-slate-200 mt-auto">
                                <div className="flex items-center gap-4 bg-white p-3 rounded-2xl border border-slate-200 shadow-sm">
                                    <button onClick={() => setIsPlaying(!isPlaying)} className={`w-12 h-12 rounded-full flex items-center justify-center text-white shadow-lg ${isPlaying ? 'bg-red-500' : 'bg-green-500'}`}><Icon name={isPlaying ? "Square" : "Play"} size={24} /></button>
                                    <button onClick={() => { setTime(0); setIsPlaying(false); }} className="w-10 h-10 rounded-full bg-slate-100 text-slate-400 hover:bg-slate-200 flex items-center justify-center"><Icon name="RotateCcw" size={20} /></button>
                                    <div className="flex-1 border-l pl-4"><div className={`text-[11px] font-black uppercase ${isPlaying ? 'text-green-500' : 'text-slate-400'}`}>{isPlaying ? '運轉中' : '系統暫停'}</div></div>
                                </div>
                            </div>
                        </aside>

                        <main className="flex-1 p-12 overflow-auto flex items-start justify-center bg-slate-300">
                            {/* 橫式底板：使用 box-content 確保 16px 邊框包裹在 350x300mm 畫布外 */}
                            <div className="bg-white rounded-xl shadow-2xl relative border-[16px] border-slate-100 ring-1 ring-slate-300 flex-shrink-0 box-content" style={{ width: CANVAS_W, height: CANVAS_H }}>
                                <canvas ref={canvasRef} width={CANVAS_W} height={CANVAS_H} onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp} />
                                <div className="absolute top-4 right-4 bg-white/60 backdrop-blur px-3 py-1 rounded-full text-[8px] font-black text-slate-500 border border-slate-200 uppercase tracking-widest pointer-events-none">350x300mm | 26x25 Holes</div>
                            </div>
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
